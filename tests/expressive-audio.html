<!doctype html><html lang="en"><title>Expressive audio validation</title><pre id="result">Rendering…</pre><script src="../dist/ambient-pad.js"></script><script src="../dist/chord-timing.js"></script><script>
(async()=>{const report=[],out=document.getElementById('result');try{
async function render(options={},change=false){const c=new OfflineAudioContext(2,44100*3,44100),p=new AmbientPad(c,{attack:.05,release:.25,cutoff:1000,detune:8,reverb:0,delay:0,depth:0,...options});[48,52,55].forEach(m=>p.note(m,0,1.7,.8));let update;if(change){c.suspend(.5).then(()=>{p.set({cutoff:3000,layerMix:.6,pitchDepth:12,panDepth:.8,chorus:.7});c.resume()})}const b=await c.startRendering();let sum=0;for(let ch=0;ch<2;ch++)for(const x of b.getChannelData(ch)){if(!Number.isFinite(x))throw Error('Non-finite audio');sum+=x*x}if(sum<.01)throw Error('Silent render');p.dispose();return b}
const base=await render();for(const [name,patch] of Object.entries({'Second layer':{layerMix:.6,layerWave:'sine',layerOctave:1},'Chorus':{chorus:.7},'Filter envelope':{filterEnv:3200,filterAttack:.5,filterDecay:.7},'Pitch drift':{pitchDepth:15,pitchRate:.4},'Pan motion':{panDepth:.8,panRate:.3}})){const b=await render(patch);let diff=0;for(let i=0;i<b.length;i++)diff+=Math.abs(b.getChannelData(0)[i]-base.getChannelData(0)[i]);if(diff/b.length<.00001)throw Error(name+' did not change rendered audio');report.push('PASS '+name+' · audio difference '+(diff/b.length).toFixed(5));out.textContent=report.join('\n')}
await render({},true);report.push('PASS Held-note parameter changes');
const c=new OfflineAudioContext(2,44100*7,44100),p=new AmbientPad(c,{attack:.03,release:.1,layerMix:.3,chorus:.4,reverb:.2});for(let i=0;i<100;i++)p.note(48+i%12,i*.05,.04,.8);if(p.voices.size!==100)throw Error('Offline voice dropped');let b=await c.startRendering(),sum=0;for(let i=44100*4.8;i<44100*5.2;i++)sum+=b.getChannelData(0)[i]**2;if(sum<.001)throw Error('Final notes missing');p.dispose();report.push('PASS 100 voices, including final notes');
// Check final chord gate crosses the loop seam and survives into offline tail.
if(ChordTiming.gateLength({length:8,transition:1})!==9||ChordTiming.endBeat([{start:24,length:9}],8)!==33)throw Error('Overlap tail mismatch');report.push('PASS Gap/overlap scheduling and export tail');out.textContent=report.join('\n')+'\nALL CHECKS PASSED';
}catch(e){out.textContent=report.join('\n')+'\nFAIL: '+e.stack}})();</script></html>
