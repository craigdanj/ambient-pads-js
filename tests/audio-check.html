<!doctype html><title>Audio validation</title><pre id="result">Rendering audio checks…</pre><script src="../dist/ambient-pad.js"></script><script>
(async()=>{try{const c=new OfflineAudioContext(2,44100*8,44100),pad=new AmbientPad(c,{attack:.03,release:.2,reverb:.3});for(let i=0;i<100;i++)pad.note(48+i%12,i*.06,.045,.8);if(pad.voices.size!==100)throw Error('Offline voice scheduling dropped notes');let b=await c.startRendering(),left=b.getChannelData(0),right=b.getChannelData(1),energy=0,last=0,stereo=0,peak=0;for(let i=0;i<left.length;i++){if(!Number.isFinite(left[i])||!Number.isFinite(right[i]))throw Error('Non-finite audio');peak=Math.max(peak,Math.abs(left[i]),Math.abs(right[i]));energy+=left[i]*left[i];stereo+=Math.abs(left[i]-right[i]);if(i>44100*5.8&&i<44100*6.2)last+=left[i]*left[i]}if(energy<.01||last<.01||stereo<.01)throw Error('Missing audio or stereo output');document.getElementById('result').textContent='PASS: 100 scheduled voices, finite stereo output, non-silent final notes. Peak: '+peak.toFixed(4)+', RMS: '+Math.sqrt(energy/left.length).toFixed(4)}catch(e){document.getElementById('result').textContent='FAIL: '+e.stack}})();</script>
